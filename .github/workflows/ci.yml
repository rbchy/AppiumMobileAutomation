# Sauce Labs My Demo App (Android) — mobile CI
#   unit   : compile + device-free framework tests (fast feedback, no emulator)
#   android: boot an Android 13 emulator (KVM), start Appium 2 + UiAutomator2,
#            install the My Demo App APK and run the full TestNG regression suite.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Compile + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B -ntp test -Dsuite=testng-unit
      - name: Test summary
        if: always()
        run: for f in target/surefire-reports/*.txt; do [ -f "$f" ] && cat "$f"; done

  android:
    name: Appium tests on Android 13 emulator
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_LEVEL: 33
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable KVM (hardware-accelerated emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Appium 2 + UiAutomator2 driver
        run: |
          npm install -g appium@2
          appium driver install uiautomator2@3.10.0   # 3.x is the last driver line that supports Appium 2
          appium --version

      - name: Download the app under test
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/get-apk.sh

      - name: Resolve Maven dependencies
        run: mvn -B -ntp test-compile

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-google_apis-x86_64

      - name: Create AVD snapshot (first run only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot created"

      - name: Run the TestNG regression suite
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb devices
            adb install -r "$APP_PATH"
            nohup appium --log-level warn --log appium.log --relaxed-security > /dev/null 2>&1 & echo $! > appium.pid ; sleep 8 ; curl -s http://127.0.0.1:4723/status
            mvn -B -ntp test ; status=$? ; kill "$(cat appium.pid)" 2>/dev/null ; exit $status

      - name: Test summary
        if: always()
        run: |
          for f in target/surefire-reports/*.txt; do [ -f "$f" ] && cat "$f"; done
          grep -ho '<testcase [^>]*' target/surefire-reports/TEST-*.xml 2>/dev/null || true
          # What was on screen when a test failed: visible texts and resource ids
          for x in target/page-sources/*_FAILED.xml; do
            [ -f "$x" ] || continue
            echo "=== $x"
            grep -oE '(text|content-desc|resource-id)="[^"]+"' "$x" | sort -u | head -60
          done

      - name: Upload reports (Allure results, page sources, surefire, Appium log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-reports
          path: |
            target/allure-results
            target/page-sources
            target/surefire-reports
            appium.log
          if-no-files-found: ignore
